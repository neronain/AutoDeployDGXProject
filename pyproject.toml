[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmds"
authors = [{ name = "neronain" }]
dynamic = ["version"]          # source of truth เดียว: src/lmds/__init__.py
description = "Local Model Deploy Studio - generate validated model deployment bundles for DGX Spark and RTX servers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
keyring = ["keyring>=24.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "fastapi>=0.110", "uvicorn>=0.27", "ruff>=0.6"]

[project.scripts]
lmds = "lmds.cli.main:app"

[tool.hatch.version]
path = "src/lmds/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lmds"]
# _build.py ถูก .gitignore ไว้ (เป็นของแต่ละเครื่อง ไม่ใช่ของ repo) และ hatchling ตัดไฟล์ที่
# VCS ignore ออกจาก wheel โดยอัตโนมัติ — ต้องบอกให้เอากลับเข้าไป ไม่งั้น node ที่ติดตั้งแบบ
# ปกติจะไม่มีวันรู้ว่าตัวเองรัน commit ไหน
artifacts = ["src/lmds/_build.py"]

# เอกสารเดินทางไปกับแพ็กเกจ — ผู้ช่วยค้นจากไฟล์จริงตอนตอบคำถาม และเครื่องที่ติดตั้ง
# ด้วย pip ไม่มี repo ให้ค้น · ไม่ใส่แล้วฟีเจอร์นี้ตายเงียบ ๆ บนทุก node ที่ไม่ใช่เครื่องพัฒนา
# (เจอจริงตอนติดตั้งครั้งแรก: playbook มาครบ แต่ "docs ค้นได้ 0 ไฟล์")
#
# ตารางนี้ต้องอยู่ **ท้ายสุด** ของบล็อก wheel — TOML ให้ทุกคีย์ที่ตามหลังหัวตารางเป็น
# ของตารางนั้น วางไว้กลางบล็อกแล้ว `artifacts` จะกลายเป็นคีย์ของ force-include
[tool.hatch.build.targets.wheel.force-include]
"docs" = "lmds/assistant/_docs"

# ── lint ─────────────────────────────────────────────────────────────────────
# ขอบเขตของ gate นี้คือ **ความถูกต้อง ไม่ใช่สไตล์** — เป็นการเลือกโดยตั้งใจ ไม่ใช่ความขี้เกียจ:
# ชุดกฎเดียวกับ LiteGate (E,F,I,UP,B) ให้ผลที่นี่ 3,362 ข้อ โดย 2,828 ข้อเป็น E501
# บรรทัดยาว ซึ่งเกือบทั้งหมดคือคอมเมนต์ภาษาไทยที่อธิบาย "ทำไม" ของโค้ด — ตัดให้สั้นลง
# เพื่อให้ผ่าน linter คือการแลกสิ่งที่มีค่าที่สุดในฐานโค้ดนี้กับตัวเลขที่ไม่มีใครได้ประโยชน์
# เลือก F (bug จริง: import ค้าง, ตัวแปรลอย, ชื่อซ้ำ) + B (กับดัก: closure ในลูป,
# zip ที่ยาวไม่เท่ากัน, exception ที่กลืน cause) แทน — รอบแรกจับของจริงได้ 2 อย่าง:
# `running_slots` หายจาก `__all__` ของ lmds.fleet และ helper ที่ปิดทับตัวแปรลูปใน profiler
# จะเพิ่ม E/I/UP ทีหลังได้ แต่ต้องมาพร้อมการตัดสินใจเรื่องคอมเมนต์ไทย ไม่ใช่แอบเปิด
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "B"]
# B008 = ค่าเริ่มต้นเป็นการเรียกฟังก์ชัน — เป็นสำนวนปกติของ typer/FastAPI ทั้งคู่
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# pytest ฉีด fixture ผ่านชื่อพารามิเตอร์ ตัวที่ import fixture มาแล้วรับเป็นพารามิเตอร์
# จึงดูเหมือน "นิยามซ้ำ" ในสายตา ruff ทั้งที่เป็นวิธีใช้งานที่ถูกต้อง (18 จุดในชุดนี้)
"tests/*" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
