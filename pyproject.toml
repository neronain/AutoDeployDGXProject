[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmds"
dynamic = ["version"]          # source of truth เดียว: src/lmds/__init__.py
description = "Local Model Deploy Studio - generate validated model deployment bundles for DGX Spark and RTX servers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
keyring = ["keyring>=24.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
lmds = "lmds.cli.main:app"

[tool.hatch.version]
path = "src/lmds/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lmds"]
# _build.py ถูก .gitignore ไว้ (เป็นของแต่ละเครื่อง ไม่ใช่ของ repo) และ hatchling ตัดไฟล์ที่
# VCS ignore ออกจาก wheel โดยอัตโนมัติ — ต้องบอกให้เอากลับเข้าไป ไม่งั้น node ที่ติดตั้งแบบ
# ปกติจะไม่มีวันรู้ว่าตัวเองรัน commit ไหน
artifacts = ["src/lmds/_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
