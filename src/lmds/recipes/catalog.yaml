# สูตรที่ผ่านการรันจริงและ settings hints ที่มีที่มา — ใช้เมื่อไม่มี LLM provider
#
# ลูกค้า/ทีม SI จำนวนมากไม่มี API key ของ LLM ทำให้ `lmds deploy` ตกไปใช้ rule-based
# ซึ่งไม่รู้เรื่องเฉพาะรุ่น (parser, image, ข้อบังคับของ quantization) แล้ว start ไม่ผ่าน
#
# `status: hardware-validated` (ค่าเริ่มต้น) คือ bundle ที่รันจริงบนฮาร์ดแวร์แล้ว
# `status: settings-only` คือ hint ที่ตรวจที่มาแล้ว แต่ prerequisites/runtime ของ LMDS ยังไม่ครบ
# ทุกสูตรต้องมี `source`; `validated_on` ต้องบอกระดับหลักฐานตามจริง
#
# กติกา:
#   - ใส่เฉพาะค่าที่ "ต้องตั้ง" จริง ๆ ค่าที่ปล่อยให้ระบบคำนวณเองอย่าใส่ (เช่น context
#     ที่ควรมาจากการวิเคราะห์หน่วยความจำของเครื่องเป้าหมาย ไม่ใช่ค่าคงที่)
#   - `match` เทียบกับ repo id แบบไม่สนตัวพิมพ์ · ใช้ prefix ได้เพื่อครอบทุก variant
#   - สูตรไม่ผูกกับ target — เครื่องเล็กเครื่องใหญ่ใช้สูตรเดียวกันได้ ส่วน context/TP
#     ยังมาจาก fit analyzer เหมือนเดิม

version: 1

recipes:
  - match: nvidia/DeepSeek-V4-Flash-NVFP4
    label: DeepSeek-V4-Flash (NVFP4)
    engine: vllm
    # build เฉพาะของ DGX Spark — image ทั่วไปยังไม่มี kernel ของ DeepSeek V4
    image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
    image_for: [unified]   # build/ทดสอบบน DGX Spark
    serving:
      # layout เฉพาะของ DeepSeek V4 — ค่า fp8 ธรรมดาผ่าน assertion ก็จริงแต่ไม่ใช่ของที่ build นี้ใช้
      kv_cache_dtype: nvfp4_ds_mla
      moe_backend: marlin
      max_num_seqs: 6
      block_size: 256
      max_cudagraph_capture_size: 24
      generation_config: vllm
      # FULL cudagraph ทำให้ kernel init ของ DeepGEMM/tilelang เรียกคนละ signature
      # ("Expected 7 but got 8 arguments") — สคริปต์ที่รันผ่านจริงบังคับ PIECEWISE ไว้
      compilation_config: '{"cudagraph_mode":"PIECEWISE"}'
      async_scheduling: true
      max_num_batched_tokens: 8192
    env:
      # ตัวที่ทำให้ start ไม่ผ่านถ้าไม่ตั้ง: profiler ของ CUDA graph ไปเรียก TVM-FFI คนละ signature
      # แล้วตายที่ determine_available_memory ด้วย "Expected 7 but got 8 arguments"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
    tool_calling:
      enabled: true
      parser: deepseek_v4
    reasoning:
      enabled: true
      parser: deepseek_v4
    notes:
      - โมเดล MoE ขนาดใหญ่ ต้องใช้ 2 เครื่องขึ้นไปบน DGX Spark
      - ตรวจ cache layout ให้ดี — weight ที่โหลดด้วย HF รุ่นเก่าอยู่นอก hub/
    source: https://github.com/neronain/deepseek-v4-flash-nvfp4-stacked-on-DGX-Spark
    validated_on: 2x DGX Spark (GB10) · vLLM dspark build · TP=2 · test-text ผ่าน 5 ส.ค. 2569

  - match: meta-llama/Llama-3.3-70B-Instruct
    label: Llama-3.3-70B-Instruct
    engine: vllm
    image: nvcr.io/nvidia/vllm:26.05-py3
    image_for: [unified]   # build/ทดสอบบน DGX Spark
    serving:
      max_num_seqs: 4
    tool_calling:
      enabled: true
      parser: llama3_json
      # template ของ Llama 3.1 ใช้กับ 3.3 ได้ — เป็นตัวที่ vLLM แนะนำเอง
      chat_template: tool_chat_template_llama3.1_json.jinja
    notes:
      - bf16 131 GB — ต้องใช้ 2 เครื่อง (TP=2) บน DGX Spark
      - gated repo ต้องมี HF token
    source: https://github.com/neronain/Deploy-Llama-3.3-70B-use-vLLM-On-NVIDIA-DGX-Spark-x2
    validated_on: 2x DGX Spark (GB10) · vLLM 26.05 NGC · TP=2 · 5 ส.ค. 2569

  - match: Qwen/Qwen3.5-122B-A10B-GPTQ-Int4
    label: Qwen3.5-122B-A10B (GPTQ-Int4)
    engine: vllm
    serving:
      quantization: gptq
      gpu_memory_utilization: 0.85
      trust_remote_code: true
    tool_calling:
      enabled: true
      parser: qwen3_coder
    reasoning:
      enabled: true
      parser: qwen3
    source: https://github.com/neronain/Qwen3.5-122B-GPTQ-Int4-on-DGX-Spark
    validated_on: DGX Spark (GB10) เครื่องเดียว

  - match: ucbye/Qwen3-Coder-Next-NVFP4-GB10
    label: Qwen3-Coder-Next (NVFP4-GB10)
    engine: vllm
    image: avarok/dgx-vllm-nvfp4-kernel:latest
    image_for: [unified]   # build/ทดสอบบน DGX Spark
    serving:
      kv_cache_dtype: fp8
    tool_calling:
      enabled: true
      parser: qwen3_coder
    notes:
      - NVFP4 ที่ quantize มาสำหรับ GB10 โดยเฉพาะ ต้องใช้ image ที่มี kernel ตรงรุ่น
    source: https://github.com/neronain/Qwen3-Coder-Next-NVFP4-GB10
    validated_on: DGX Spark (GB10) เครื่องเดียว

  - match: zai-org/GLM-4.7-Flash
    label: GLM-4.7-Flash (MoE 30B-A3B)
    engine: sglang
    image: lmsysorg/sglang:latest
    serving:
      mem_fraction_static: 0.85
    tool_calling:
      enabled: true
      parser: glm47
    reasoning:
      enabled: true
      parser: glm47
    speculative:
      algorithm: EAGLE
    notes:
      - SGLang ยังไม่อยู่ในชุด template ของ LMDS — สูตรนี้ใช้เป็นข้อมูลอ้างอิงก่อน
    source: https://github.com/neronain/GLM-4.7-Flash-on-DGXSpark
    validated_on: DGX Spark (GB10) เครื่องเดียว

  - match: google/gemma-4-31B-it
    label: Gemma-4-31B-it
    engine: vllm
    image: vllm/vllm-openai:latest
    serving:
      dtype: bfloat16
    source: https://github.com/neronain/Gemma-4-31B-it-on-DGX-Spark-128G-with-vLLM
    validated_on: DGX Spark (GB10) 128 GB เครื่องเดียว

  - match: nvidia/NVIDIA-Nemotron-3-Super
    label: Nemotron-3-Super (120B)
    engine: vllm
    image: vllm/vllm-openai:v0.20.0
    image_for: [unified]   # build/ทดสอบบน DGX Spark
    serving:
      kv_cache_dtype: fp8
    env:
      # ค่าพวกนี้ต้องตั้งตอนรัน ไม่ใช่ flag ของ vLLM — ไม่ตั้งแล้ว MoE FP4 เลือก backend ผิด
      VLLM_NVFP4_GEMM_BACKEND: marlin
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
      VLLM_USE_FLASHINFER_MOE_FP4: "0"
    source: https://github.com/neronain/Nemotron-120B-DGXSpark
    validated_on: DGX Spark (GB10) เครื่องเดียว

  # ─────────────────────────────────────────────────────────────────────
  # Parser hints จาก eugr/spark-vllm-docker commit 42b3a793 (MIT)
  # เก็บเฉพาะชื่อ parser ที่ portable เท่านั้น ไม่คัดลอก serving/env/image จาก upstream:
  # หลายสูตรพึ่ง local image, patches, chat template หรือ parser plugin ที่ LMDS ยังติดตั้งไม่ได้
  # จึงติด status=settings-only และไม่อ้างว่า bundle ของ LMDS ผ่าน runtime validation

  - match: Qwen/Qwen3.5-35B-A3B
    label: Qwen3.5-35B-A3B (parser hint)
    engine: vllm
    status: settings-only
    tool_calling:
      enabled: true
      parser: qwen3_coder
    notes:
      - settings-only — upstream FP8 recipe ยังพึ่ง fix-qwen3-coder-next และ chat-template mod;
        LMDS ยังไม่ bundle prerequisites เหล่านี้
    source: https://github.com/eugr/spark-vllm-docker/blob/42b3a7932ee60d9baf0f706c6ab681fdef62d0fe/recipes/qwen3.5-35b-a3b-fp8.yaml
    validated_on: not validated as an LMDS bundle — imported parser name only (upstream MIT recipe)

  - match: Qwen/Qwen3.5-122B-A10B-FP8
    label: Qwen3.5-122B-A10B FP8 (parser hint)
    engine: vllm
    status: settings-only
    tool_calling:
      enabled: true
      parser: qwen3_coder
    reasoning:
      enabled: true
      parser: qwen3
    notes:
      - settings-only — upstream ใช้ unsloth.jinja จาก chat-template mod ซึ่ง LMDS ยังไม่ bundle
    source: https://github.com/eugr/spark-vllm-docker/blob/42b3a7932ee60d9baf0f706c6ab681fdef62d0fe/recipes/qwen3.5-122b-fp8.yaml
    validated_on: not validated as an LMDS bundle — imported parser names only (upstream MIT recipe)

  - match: Qwen/Qwen3.6-35B-A3B-FP8
    label: Qwen3.6-35B-A3B FP8 (parser hint)
    engine: vllm
    status: settings-only
    tool_calling:
      enabled: true
      parser: qwen3_xml
    reasoning:
      enabled: true
      parser: qwen3
    notes:
      - settings-only — upstream ใช้ fixed_chat_template.jinja จาก chat-template mod;
        LMDS ยังไม่ bundle ไฟล์นี้
    source: https://github.com/eugr/spark-vllm-docker/blob/42b3a7932ee60d9baf0f706c6ab681fdef62d0fe/recipes/qwen3.6-35b-a3b-fp8.yaml
    validated_on: not validated as an LMDS bundle — imported parser names only (upstream MIT recipe)

  - match: nvidia/Qwen3.6-35B-A3B-NVFP4
    label: Qwen3.6-35B-A3B NVFP4 (parser hint)
    engine: vllm
    status: settings-only
    tool_calling:
      enabled: true
      parser: qwen3_xml
    reasoning:
      enabled: true
      parser: qwen3
    notes:
      - settings-only — upstream ทดสอบกับ local vllm-node image; LMDS ยังไม่ validate image/runtime เดียวกัน
    source: https://github.com/eugr/spark-vllm-docker/blob/42b3a7932ee60d9baf0f706c6ab681fdef62d0fe/recipes/qwen3.6-35b-a3b-nvfp4.yaml
    validated_on: not validated as an LMDS bundle — imported parser names only (upstream MIT recipe)

  - match: QuantTrio/MiniMax-M2
    label: MiniMax-M2 AWQ (parser hint)
    engine: vllm
    status: settings-only
    tool_calling:
      enabled: true
      parser: minimax_m2
    reasoning:
      enabled: true
      parser: minimax_m2
    notes:
      - settings-only — upstream image มี MiniMax runtime patch; LMDS ยังไม่ validate default image กับโมเดลนี้
    source: https://github.com/eugr/spark-vllm-docker/blob/42b3a7932ee60d9baf0f706c6ab681fdef62d0fe/recipes/minimax-m2-awq.yaml
    validated_on: not validated as an LMDS bundle — imported parser names only (upstream MIT recipe)

  - match: stepfun-ai/Step-3.7-Flash
    label: Step-3.7-Flash (parser hint)
    engine: vllm
    status: settings-only
    tool_calling:
      enabled: true
      parser: step3p5
    reasoning:
      enabled: true
      parser: step3p5
    notes:
      - settings-only — upstream ต้องใช้ Step-3.7 support patch และ gpu-mem-util-gb mod;
        LMDS ยังไม่ bundle สอง prerequisite นี้
    source: https://github.com/eugr/spark-vllm-docker/blob/42b3a7932ee60d9baf0f706c6ab681fdef62d0fe/recipes/step-3.7-flash-fp8.yaml
    validated_on: not validated as an LMDS bundle — imported parser names only (upstream MIT recipe)

  - match: openai/gpt-oss-120b
    label: GPT-OSS-120B (parser hint)
    engine: vllm
    status: settings-only
    tool_calling:
      enabled: true
      parser: openai
    reasoning:
      enabled: true
      parser: openai_gptoss
    notes:
      - settings-only — upstream ต้องใช้ local vllm-node-mxfp4 image, MXFP4 env และ flags;
        LMDS ยังไม่รองรับ prerequisites เหล่านี้ จึงไม่ใช่สูตร deploy ที่พร้อมรัน
    source: https://github.com/eugr/spark-vllm-docker/blob/42b3a7932ee60d9baf0f706c6ab681fdef62d0fe/recipes/openai-gpt-oss-120b.yaml
    validated_on: not validated as an LMDS bundle — imported parser names only (upstream MIT recipe)

  - match: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
    label: Nemotron-3-Nano NVFP4 (tool parser hint)
    engine: vllm
    status: settings-only
    tool_calling:
      enabled: true
      parser: qwen3_coder
    notes:
      - settings-only — ไม่ตั้ง nano_v3 reasoning parser เพราะต้องโหลด plugin ภายนอก;
        LMDS ยังไม่ bundle/verify plugin นี้
    source: https://github.com/eugr/spark-vllm-docker/blob/42b3a7932ee60d9baf0f706c6ab681fdef62d0fe/recipes/nemotron-3-nano-nvfp4.yaml
    validated_on: not validated as an LMDS bundle — imported tool parser only (upstream MIT recipe)
