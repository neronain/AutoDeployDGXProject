      - context ตั้งต้น 32,768 · น้ำหนัก bf16 ~16 GB — สูตรเดียวกับ 4B ต่างแค่ขนาด
    source: https://docs.vllm.ai/en/latest/models/pooling_models/ (scoring · Qwen3-Reranker hf_overrides) + https://huggingface.co/Qwen/Qwen3-Reranker-8B
