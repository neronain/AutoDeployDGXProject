# สูตรที่ผ่านการรันจริงแล้ว — ใช้เมื่อไม่มี LLM provider
#
# ลูกค้า/ทีม SI จำนวนมากไม่มี API key ของ LLM ทำให้ `lmds deploy` ตกไปใช้ rule-based
# ซึ่งไม่รู้เรื่องเฉพาะรุ่น (parser, image, ข้อบังคับของ quantization) แล้ว start ไม่ผ่าน
#
# แฟ้มนี้คือความรู้ที่ได้จากการรันจริงบนฮาร์ดแวร์ ไม่ใช่การเดา — ทุกสูตรต้องมี `source`
# บอกว่ามาจากไหน และ `validated_on` บอกว่าเคยรันผ่านบนเครื่องอะไร
#
# กติกา:
#   - ใส่เฉพาะค่าที่ "ต้องตั้ง" จริง ๆ ค่าที่ปล่อยให้ระบบคำนวณเองอย่าใส่ (เช่น context
#     ที่ควรมาจากการวิเคราะห์หน่วยความจำของเครื่องเป้าหมาย ไม่ใช่ค่าคงที่)
#   - `match` เทียบกับ repo id แบบไม่สนตัวพิมพ์ · ใช้ prefix ได้เพื่อครอบทุก variant
#   - สูตรไม่ผูกกับ target — เครื่องเล็กเครื่องใหญ่ใช้สูตรเดียวกันได้ ส่วน context/TP
#     ยังมาจาก fit analyzer เหมือนเดิม

version: 1

recipes:
  - match: nvidia/DeepSeek-V4-Flash-NVFP4
    label: DeepSeek-V4-Flash (NVFP4)
    engine: vllm
    # build เฉพาะของ DGX Spark — image ทั่วไปยังไม่มี kernel ของ DeepSeek V4
    image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
    image_for: [unified]   # build/ทดสอบบน DGX Spark
    serving:
      # layout เฉพาะของ DeepSeek V4 — ค่า fp8 ธรรมดาผ่าน assertion ก็จริงแต่ไม่ใช่ของที่ build นี้ใช้
      kv_cache_dtype: nvfp4_ds_mla
      moe_backend: marlin
      max_num_seqs: 6
      block_size: 256
      max_cudagraph_capture_size: 24
      generation_config: vllm
      # FULL cudagraph ทำให้ kernel init ของ DeepGEMM/tilelang เรียกคนละ signature
      # ("Expected 7 but got 8 arguments") — สคริปต์ที่รันผ่านจริงบังคับ PIECEWISE ไว้
      compilation_config: '{"cudagraph_mode":"PIECEWISE"}'
      async_scheduling: true
      max_num_batched_tokens: 8192
    env:
      # ตัวที่ทำให้ start ไม่ผ่านถ้าไม่ตั้ง: profiler ของ CUDA graph ไปเรียก TVM-FFI คนละ signature
      # แล้วตายที่ determine_available_memory ด้วย "Expected 7 but got 8 arguments"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
    tool_calling:
      enabled: true
      parser: deepseek_v4
    reasoning:
      enabled: true
      parser: deepseek_v4
    notes:
      - โมเดล MoE ขนาดใหญ่ ต้องใช้ 2 เครื่องขึ้นไปบน DGX Spark
      - ตรวจ cache layout ให้ดี — weight ที่โหลดด้วย HF รุ่นเก่าอยู่นอก hub/
    source: https://github.com/neronain/deepseek-v4-flash-nvfp4-stacked-on-DGX-Spark
    validated_on: 2x DGX Spark (GB10) · vLLM dspark build · TP=2 · test-text ผ่าน 5 ส.ค. 2569

  - match: mazinb/Qwen3.8-Flash-Next-Uncensored-NVFP4
    label: Qwen3.8-Flash-Next Uncensored (NVFP4) · 2-node
    engine: vllm
    # สถาปัตยกรรม qwen4_exp ใหม่มาก — vLLM 0.20 (image NVFP4 ตัวเดิม) ไม่รู้จัก ต้อง nightly ≥ 0.28 (transformers 5.16)
    # digest นี้ = vllm/vllm-openai:nightly 4 ก.ย. 2569 (arm64) · pin ไว้เพราะ tag nightly เลื่อนทุกวัน
    image: vllm/vllm-openai@sha256:f5df5cc3302b5f404848c4eca88d7bf7ed5226e151c056da22816d7734644d67
    image_for: [unified]   # ทดสอบบน DGX Spark
    env:
      # NVFP4 บน SM121: บังคับ Marlin ไม่งั้น JIT cutlass FP4 แล้วตาย (ptxas .e2m1x2)
      VLLM_NVFP4_GEMM_BACKEND: marlin
      VLLM_TEST_FORCE_FP8_MARLIN: "1"
      VLLM_USE_FLASHINFER_MOE_FP4: "0"
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
    tool_calling:
      enabled: true
      parser: qwen3_xml
    reasoning:
      enabled: true
      parser: qwen3
    notes:
      - 173.6 GB safetensors (95 shard) → ต้อง 2 เครื่องบน DGX Spark · repo เป็น gated ต้องมี HF token
      - Qwen3.5+ DeltaNet — อย่าเปิด --enable-prefix-caching
    source: LMDS stacked deploy บน spark-head+spark-worker
    validated_on: 2x DGX Spark (GB10) · vLLM 0.28.1rc1 nightly · TP=2 · download 134 นาที · test-text ผ่าน 5 ก.ย. 2569

  - match: orcarouter/GLM-5.3-Flash-Uncensored-NVFP4
    label: GLM-5.3-Flash NVFP4 · 2× DGX Spark (orcarouter uncensored · validated)
    engine: vllm
    # สถาปัตยกรรม glm5_next (MLA แบบ NoPE + DSA sparse indexer + KDA) — vLLM stock/nightly และ image glm53-flash ของ Red Hat
    # ตายตอน warm-up บน SM121 ("pe_dim must be 64 for fp8_ds_mla": backend sparse-MLA ตัวเดียวของ SM120/121 บังคับ KV layout
    # ของ DeepSeek) · image นี้ = build ของชุมชน DGX Spark (coolbho3k/tonyd2wild) ที่เพิ่ม FP8 NoPE MLA cache 528 byte สำหรับ GB10
    # · pin digest ของ tag sm121-v8 · รันผ่านจริง 2026-09-06 บน spark-head+spark-worker (eager + gpu-util → CUDA graph + pin KV รอบสอง)
    image: ghcr.io/tonyd2wild/vllm-glm53-flash@sha256:d77d375c742fc54f436dec5108b440f58f021bc6600052bf0e8fe5840357e78f
    image_for: [unified]
    serving:
      context: 262144            # เพดานของ image นี้บน GB10: 524288 ชน persistent_topk oversubscribe (48 SM)
      max_num_seqs: 6
      gpu_memory_utilization: 0.85
      kv_cache_dtype: fp8_e4m3   # ผ่าน FA2 smem patch ใน image · fp8 = KV 913K tokens ที่ ctx 262K
      moe_backend: marlin        # NVFP4 MoE บน SM121
      block_size: 2304           # DeepGEMM arch-12 pool page — image ปรับเป็น 4608 เองเมื่อ KV fp8
      kv_cache_memory: 3758096384   # pin KV 3.5 GiB (= ~469K tokens ที่ fp8) — ปล่อยตาม gpu-util 0.85 แล้วเครื่องกิน 115/121 GiB + swap 4 GB
      # ไม่ใส่ enforce_eager: CUDA graph กิน +0.5 GiB แต่ decode 10.3 tok/s (eager 9.0) · context ไม่มีผลกับ RAM เมื่อ pin KV แล้ว
      trust_remote_code: true
    env:
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TORCH_CUDA_ARCH_LIST: 12.1a
      FLASHINFER_CUDA_ARCH_LIST: 12.1a
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
    tool_calling:
      enabled: true
      parser: glm47
    reasoning:
      enabled: true
      parser: glm45      # ปิด thinking แล้ว reasoning รั่วเข้า content — เปิด thinking เป็นค่าตั้งต้น
                         # โจทย์ coding ภาษาไทย: thinking กิน reasoning >5,000 token ก่อนตอบ (10 tok/s = 8 นาที) — client ต้องให้ max_tokens ≥ 8192
    notes:
      - ~190 GB NVFP4 → ต้อง stacked 2 เครื่องบน DGX Spark (~92 GiB/rank) · ห้ามใช้ image อื่น ห้ามตั้ง context เกิน 262144
      - MTP (--speculative-config '{"method":"mtp","num_speculative_tokens":4}') ใช้ได้เฉพาะ checkpoint ที่มีเลเยอร์ MTP (layer 45) = RedHatAI เท่านั้น ·
        orcarouter uncensored และ coolbho3k Optimized ไม่มี (layers 0–44 ทั้งที่ config บอก num_nextn_predict_layers 1) → เปิดแล้วโหลดไม่ผ่าน ·
        MTP บน RedHat และ DFlash2 draft + image sm121-v11 (ชุมชนได้ 21.8 tok/s) ยังไม่ได้ทดสอบใน LMDS
    source: https://github.com/coolbho3k/GLM-5.3-Flash-NVFP4-DFlash2-2x-DGX-Spark (feature/exl3-ab-current) · launch-glm53-vllm-tp2.sh
    validated_on: 2x DGX Spark (GB10, CUDA 13, arm64) · TP=2 · 2026-09-06 · รอบแรก (eager, gpu-util 0.85) test-text/tools/reasoning ผ่าน TTFT 0.29 s decode 9 tok/s · รอบสอง (pin KV 3.5 GiB + CUDA graph) decode 9.6–10.3 tok/s stress 8 คน 27.8 tok/s RAM 113/121 GiB ไม่แตะ swap เพิ่ม · KV 540K tokens ที่ ctx 262K

